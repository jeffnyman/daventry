# Publishes the NuGet packages to nuget.org with Trusted Publishing: no API key is stored anywhere.
# Push a tag such as v0.1.0-alpha (the tag without its "v" becomes the package version), or run the
# workflow by hand from the Actions tab with a version.
#
# One-time setup:
#   - nuget.org: your username > Trusted Publishing > add a policy for this repository's owner, the
#     repository "daventry" and the workflow file "publish.yml"
#   - GitHub: Settings > Secrets and variables > Actions > New repository secret NUGET_USER, your
#     nuget.org username (not your email)
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 0.1.0-alpha.2"
        required: true

permissions:
  contents: read
  id-token: write   # Trusted Publishing exchanges the workflow's OIDC token for a short-lived key

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "not a package version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $version"

      # the tests that need the Sierra game library skip themselves when it is not there
      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack -c Release -o artifacts/packages -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # the .snupkg symbol packages next to the .nupkg files go up with them
      - name: Push
        shell: pwsh
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
